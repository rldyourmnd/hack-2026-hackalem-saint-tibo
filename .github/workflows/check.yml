name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  verify:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@d9fbe93b75c105a99632ebbd9d70901404303acd # v0.6.80
    permissions:
      contents: read
    with:
      recipe: ci-source
      fetch-depth: 0
      python-version: "3.13.18"
      bun-version: "1.4.2"
      uv-version: "0.12.13"
      timeout-minutes: 45

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@d9fbe93b75c105a99632ebbd9d70901404303acd # v0.6.80
    permissions:
      contents: read
