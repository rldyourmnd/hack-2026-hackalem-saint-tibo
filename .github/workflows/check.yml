name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

jobs:
  verify:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/recipe.yml@03d53ec146797bc27d7b8b37abbf766ab82041b6 # v0.6.81
    permissions:
      contents: read
    with:
      recipe: ci-source
      fetch-depth: 0
      python-version: "3.15.2"
      bun-version: "1.4.4"
      uv-version: "0.13.9"
      timeout-minutes: 45

  merge-stops:
    if: github.event_name == 'pull_request'
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/merge-stops.yml@03d53ec146797bc27d7b8b37abbf766ab82041b6 # v0.6.81
    permissions:
      contents: read
